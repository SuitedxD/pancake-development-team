<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffd466">
  <title>Not Found — Pancake Development Team</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050505;color:#f6f4ee;font:16px system-ui,sans-serif}main{max-width:620px;padding:32px;text-align:center}a{color:#ffd466}</style>
</head>
<body>
  <main><h1>Oops! Looks like something fell out from the pan</h1><p>The page may have moved or no longer exists. Error 404.</p> <p><a id="portal-link" href="/pancake/plugins/">Return to Plugin Portal</a></p> <p>or</p> <p><a id="portal-link" href="/">Return Home</a></p> </main>
  <script>
    const portalBase = '/pancake-development-team/pancake/plugins';
    const match = window.location.pathname.match(/^\/pancake-development-team\/pancake\/plugins\/(\d{20,30})\/?$/);
    if (match) window.location.replace(`${portalBase}/?plugin=${match[1]}`);
    document.getElementById('portal-link').href = `${portalBase}/`;
  </script>
</body>
</html>
